# name: Infrastructure Tests

on:
  push:
  workflow_dispatch:

jobs:
  opentofu_test:
    name: "Run OpenTofu tests"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3

      - uses: aws-actions/configure-aws-credentials@v3
        with:
          # Provide the IAM role ARN via a repository secret named `AWS_ROLE_TO_ASSUME`
          # e.g. set secret AWS_ROLE_TO_ASSUME = arn:aws:iam::<ACCOUNT_ID>:role/<role-name>
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: tests-${{ github.run_number }}-${{ github.actor }}
          aws-region: us-east-2

      - uses: opentofu/setup-opentofu@v1

      - name: Tofu Test
        env:
          TF_VAR_name: lambda-sample-${{ github.run_id }}
        working-directory: td5/scripts/tofu/live/lambda-sample
        run: |
          tofu init -backend=false -input=false
          tofu test -verbose